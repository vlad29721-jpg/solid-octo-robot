<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a09"/>
      <stop offset="55%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#150c0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2dc91"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6d1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e3a1"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- звёзды -->
  <g fill="#d4af37" opacity="0.5">
    <circle cx="120" cy="90" r="1.6"/><circle cx="260" cy="60" r="1.2"/><circle cx="420" cy="120" r="1.4"/>
    <circle cx="980" cy="80" r="1.5"/><circle cx="1120" cy="160" r="1.2"/><circle cx="880" cy="50" r="1.1"/>
    <circle cx="70" cy="300" r="1.3"/><circle cx="1150" cy="420" r="1.4"/><circle cx="180" cy="520" r="1.2"/>
    <circle cx="1060" cy="560" r="1.3"/><circle cx="640" cy="40" r="1.2"/><circle cx="520" cy="70" r="1"/>
  </g>

  <!-- d20 -->
  <g transform="translate(880 330)">
    <circle r="150" fill="#d4af37" opacity="0.10"/>
    <polygon points="0,-128 111,-64 111,64 0,128 -111,64 -111,-64" fill="#17130d" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="0,-128 111,-64 0,0 -111,-64" fill="#d4af37" opacity="0.18" stroke="#d4af37" stroke-width="2"/>
    <polygon points="-111,-64 0,0 0,128 -111,64" fill="#8b0000" opacity="0.30" stroke="#d4af37" stroke-width="2"/>
    <polygon points="111,-64 111,64 0,128 0,0" fill="#d4af37" opacity="0.08" stroke="#d4af37" stroke-width="2"/>
    <circle r="34" fill="#0a0a0a" stroke="#d4af37" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#eadcbb">20</text>
  </g>

  <!-- текст -->
  <text x="90" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#d4af37" opacity="0.85">DUNGEONS &amp; DRAGONS · 5E · МАСТЕРСКИЯ</text>
  <text x="86" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="bold" fill="#eadcbb">D&amp;D Master Hub</text>
  <text x="90" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#c9b98f">Листы персонажей · Боевая карта · Инициатива · Кубики · Чат · ИИ на DeepSeek</text>

  <rect x="90" y="360" width="560" height="3" fill="url(#gold)" opacity="0.8"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#9b9383">
    <text x="90" y="420">Next.js 16 · TypeScript · Tailwind CSS 4 · Drizzle ORM · PostgreSQL</text>
    <text x="90" y="460">Supabase Auth / Realtime / Storage · TanStack Query · Zustand · RHF + Zod</text>
    <text x="90" y="500">Framer Motion · Liquid Glass · DeepSeek API · CC0-музыка с GitHub</text>
  </g>

  <!-- плашки -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="bold">
    <rect x="90" y="540" width="250" height="44" rx="22" fill="#8b0000" opacity="0.55"/>
    <text x="215" y="568" text-anchor="middle" fill="#f3d9d9">Тёмное фэнтези</text>
    <rect x="360" y="540" width="250" height="44" rx="22" fill="#d4af37" opacity="0.16"/>
    <text x="485" y="568" text-anchor="middle" fill="#e6c96b">Realtime для партии</text>
    <rect x="630" y="540" width="250" height="44" rx="22" fill="#d4af37" opacity="0.10"/>
    <text x="755" y="568" text-anchor="middle" fill="#eadcbb">RLS и права DM/игрок</text>
  </g>
</svg>
